<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نظام إدارة المكتبة</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- ================= تسجيل الدخول ================= -->
    <div id="loginScreen" class="login-screen">
      <div class="login-card">
        <div class="login-logo">📚</div>
        <h1 id="loginTitle">نظام إدارة المكتبة</h1>
        <p class="login-sub" id="loginSub">سجّل الدخول للمتابعة</p>
        <div
          id="loginError"
          class="alert alert-danger"
          style="display: none"
        ></div>
        <div class="form-group">
          <label id="labelUser">اسم المستخدم</label>
          <input type="text" id="loginUser" placeholder="admin" />
        </div>
        <div class="form-group">
          <label id="labelPass">كلمة المرور</label>
          <input type="password" id="loginPass" placeholder="••••••••" />
        </div>
        <button
          class="btn btn-primary btn-block"
          id="loginBtn"
          onclick="doLogin()"
        >
          تسجيل الدخول
        </button>
        <button
          class="lang-btn"
          id="langBtnLogin"
          onclick="toggleLang()"
          style="margin-top: 15px; width: 100%; justify-content: center"
        >
          🌐 <span id="langLabelLogin">EN</span>
        </button>
      </div>
    </div>

    <!-- ================= التطبيق ================= -->
    <div id="appScreen" class="app" style="display: none">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
          <span>📚</span>
          <h2 id="brandName">مكتبة النور</h2>
        </div>
        <nav class="sidebar-nav" id="sidebarNav"></nav>
      </aside>

      <div class="main">
        <header class="topbar">
          <div class="topbar-left">
            <button
              class="menu-btn"
              onclick="
                document.getElementById('sidebar').classList.toggle('open')
              "
            >
              ☰
            </button>
            <h1 id="pageTitle">لوحة التحكم</h1>
          </div>
          <div class="topbar-right">
            <button class="notif-btn" onclick="showNotifications()">
              🔔<span class="notif-badge" id="notifBadge" style="display: none"
                >0</span
              >
            </button>
            <button
              class="lang-btn"
              id="langBtn"
              onclick="toggleLang()"
              title="Change Language"
            >
              🌐 <span id="langLabel">EN</span>
            </button>
            <div class="user-chip">
              <div class="avatar" id="userAvatar">م</div>
              <div>
                <div class="user-name" id="userName">مدير</div>
                <div class="user-role" id="userRole">مدير</div>
              </div>
            </div>
            <button
              class="btn btn-danger btn-sm"
              onclick="doLogout()"
              id="logoutBtn"
            >
              خروج
            </button>
          </div>
        </header>
        <main class="content" id="content"></main>
      </div>
    </div>

    <div id="modalRoot"></div>
    <div id="toastRoot"></div>

    <script src="app.js"></script>
  </body>
</html>
